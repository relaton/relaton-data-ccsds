abstract:
- language: en
  script: Latn
  content: |
    <p>This Recommended Standard defines the Tracking Data Cross Support Transfer Service (TD-CSTS), which allows a spaceflight mission to receive periodic measurements of certain tracking data as soon as they are generated by a Cross Support Complex or any time thereafter. </p>
    <p>The current update brings the specification up to date with issue 2 of the CSTS Specification Framework, CCSDS 921.1-B-2.</p>
