abstract:
- language: en
  script: Latn
  content: |
    <p>The Parameter Value Language (PVL) Recommended Standard defines a human-readable, machine-processable language for naming and expressing data values.  This update to the first issue of the Recommended Standard extends the PVL character set definitions to include the G1 set of ISO 8859-1 to support use of accented characters used in many languages.  It also includes some clarifications and corrections to the original issue, including preservation of statement order within an object, and it updates the document style for consistency with current CCSDS style guidelines.  Changes from the previous issue are flagged with change bars in the outside margin and summarized in the Document Control section (page v).  The CCSDS conducts periodic reconfirmation reviews of its publications to assure their continued relevance.</p>
    <p>This document has been reconfirmed by the CCSDS Management Council through June 2024.</p>
