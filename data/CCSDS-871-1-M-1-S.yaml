abstract:
- language: en
  script: Latn
  content: "<p>This Recommended Practice specifies a set of related services to be
    used by space missions to access pooled data acquired from devices over an onboard
    subnetwork.  The SOIS Device Data Pooling Service provides a common service interface
    and quality of service regardless of the particular type of data link or protocol
    being used for communication.</p>\n"
