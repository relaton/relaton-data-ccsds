  content: |
    <p>This Recommended Standard provides a standard method to represent attributes and their values, as has been defined by the Abstract Syntax of the Data Entity Dictionary Specification Language (DEDSL) (CCSDS 647.1-B-1), using the Extensible Markup Language (XML) 1.0 Document Type Declaration (DTD) for the construction and interchange of data entity dictionaries. </p>
    <p>The CCSDS conducts periodic reconfirmation reviews of its publications to assure their continued relevance. This document has been reconfirmed by the CCSDS Management Council through June 2024.</p>
