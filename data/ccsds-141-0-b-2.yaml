abstract:
- language: en
  script: Latn
  content: "<p>The CCSDS 141.0-B-2 Recommended Standard defines the physical layer
    specifications for non-coherent optical communications in space data systems.
    It details essential technical parameters for optical beacons and optional data
    transmission, including center frequencies, laser linewidths, signal emissions,
    and modulation schemes. This document serves as a standardized baseline to ensure
    reliable performance and interoperability across space-based optical communication
    networks.</p>\n"
