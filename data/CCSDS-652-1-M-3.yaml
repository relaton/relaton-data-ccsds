- language: en
  script: Latn
  content: "<p>The Recommended Practice for Requirements for Bodies Providing Audit
    and Certification of Candidate Trustworthy Digital Repositories contains binding
    and verifiable specifications required to be fulfilled by organizations that perform
    ISO audits for assessing the trustworthiness of digital repositories using CCSDS
    652.0-M-1, Audit and Certification of Trustworthy Digital Repositories, and provides
    the appropriate certification. The current issue is an update based on scheduled
    five-year reconfirmation review.</p>\n"
