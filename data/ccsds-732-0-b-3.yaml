  content: |
    <p>The CCSDS Recommended Standard for AOS Space Data Link Protocol specifies the protocol, services, and procedures pertaining to the CCSDS Version-2 Transfer Frame.  The current issue adds specifications to support  the Space Data Link Security Protocol.</p>
    <p>This document issue was superseded by CCSDS 732.0-B-4, AOS Space Data Link Protocol (Blue Book, Issue 4), released October 2021.</p>
