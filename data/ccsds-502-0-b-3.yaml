abstract:
- language: en
  script: Latn
  content: |
    <p>The Orbit Data Message (ODM) Recommended Standard specifies message formats for use in transferring spacecraft orbit information between space agencies and commercial or governmental spacecraft operators. The current issue addsnOrbit Comprehensive Message, adds MESSAGE_ID keyword to existing messages (OPM, OMM, and OEM), discontinues 'Checklist ICD', creates a new SANA Registry for normative keyword values for navigation messages, and adds several annexes for example and supplementary material.</p>
    <p>The current version of this document contains all updates through technical corrigendum 1, dated June 2026.</p>
