abstract:
- language: en
  script: Latn
  content: |
    <p>This Recommended Standard defines the Pointing Request Message (PRM), a standardized format that allows space agencies and operators to exchange information about requested (sequences of) changes to the attitude of the spacecraft or to an articulated spacecraft component.</p>
    <p>The current version of this document contains all updates through technical corrigendum 2, dated October 2023.</p>
    <p>The CCSDS conducts periodic reconfirmation reviews of its publications to assure their continued relevance. This Recommended Standard has been reconfirmed through May 2029.</p>
