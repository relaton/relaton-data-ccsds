abstract:
- language: en
  script: Latn
  content: |
    <p>The Recommended Standard for multispectral and hyperspectral image compression specifies a data compression algorithm applied to digital three-dimensional image data from payload instruments, such as multispectral and hyperspectral imagers. Lossless and near-lossless methods are specified, along with a format for storing the compressed data.</p>
    <p>The current version of this document contains all updates through technical corrigendum 3, dated February 2021.</p>
