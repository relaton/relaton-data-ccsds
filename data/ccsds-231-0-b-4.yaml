abstract:
- language: en
  script: Latn
  content: "<p>The Recommended Standard for TC Synchronization and Channel Coding
    contains specifications for synchronization and channel coding to be used by space
    missions on asynchronous communications links.  The current update clarifies procedures
    related to short Low-Density Parity-Check (LDPC) codes and adds support for the
    Unified Space Data Link Protocol (USLP).</p>\n"
