  content: |
    <p>The CCSDS Recommended Standard for AOS Space Data Link Protocol specifies the protocol, services, and procedures pertaining to the CCSDS Version-2 Transfer Frame. The current update adds clarifications and support for Space Data Link Security Protocol Extended Procedures (CCSDS 355.1-B-1).</p>
    <p>This document issue was superseded by 732x0b5, AOS Space Data Link Protocol Blue Book Issue 5, released in October 2025.</p>
