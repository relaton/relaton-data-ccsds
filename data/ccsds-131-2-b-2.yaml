  content: |
    <p>This Recommended Standard defines a Serially Concatenated Convolutional turbo Coding (SCCC) scheme for telemetry applications. The current update adds support for the Unified Space Data Link Protocol and replaces the term Channel Access Data Unit (CADU) with Synch-Marked Transfer Frame (SMTF).</p>
    <p>The current version of this document contains all updates through technical corrigendum 1, dated May 2026.</p>
