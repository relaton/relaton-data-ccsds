abstract:
- language: en
  script: Latn
  content: |
    <p>The Recommended Standard for TC Synchronization and Channel Coding contains specifications for synchronization and channel coding to be used by space missions with the TC Space Data Link Protocol.  The current issue adds support for optional repeated transmissions of Transfer Frames.  </p>
    <p>The current version of this document contains all updates through technical corrigendum 1, dated April 2013.</p>
