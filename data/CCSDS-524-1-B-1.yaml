abstract:
- language: en
  script: Latn
  content: "<p>This  Recommended Standard defines the binding between the Mission
    Operations (MO) Message Abstraction Layer (MAL) specified in CCSDS 521.0-B-2 and
    the Space Packet Protocol specified in CCSDS 133.0-B-1.  This binding allows MO
    Services to use the Space Packet Protocol as messaging technology.</p>\n"
