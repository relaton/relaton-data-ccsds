abstract:
- language: en
  script: Latn
  content: "<p>The XML Specification for Navigation Data Messages Recommended Standard
    describes an integrated XML schema set that is suited to interagency exchanges
    of navigation data messages. The current issue removes detailed material related
    to creating XML instantiations of the Orbit Data Messages (ODM) (this material
    is now described in the ODM version 3) and rearranges the document annexes relative
    to the previous version to conform to a guideline developed for all of the CCSDS
    Navigation Working Group documents.</p>\n"
