abstract:
- language: en
  script: Latn
  content: |
    <p>The Orbit Data Message (ODM) Recommended Standard specifies message formats for use in transferring spacecraft orbit information between space agencies and commercial or governmental spacecraft operators.  Issue 2 defines a new message, the Orbit Mean-Elements Message (OMM), and adds capabilities to the messages specified in the original issue.  The current version of this document contains all updates through technical corrigendum 1, dated May 2012.</p>
    <p>This document issue was superseded by CCSDS 502.0-B-3, Orbit Data Messages (Blue Book, Issue 3), released April 2023.</p>
