abstract:
- language: en
  script: Latn
  content: "<p>The CCSDS Recommended Standard for Encapsulation Service specifies
    a communications service to be used by space missions to transfer protocol data
    units that are not directly transferred by the Space Data Link Protocols over
    a ground-to-space or space-to-space communications link.  The current update removes
    the Space Packet from available encapsulation formats, changes the name from Encapsulation
    Service to Encapsulation Packet Protocol, and adds the Unified Space Data Link
    Protocol to supported the Space Data Link protocols.</p>\n"
