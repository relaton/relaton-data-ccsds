  content: |
    <p>The XML Specification for Navigation Data Messages Recommended Standard describes an integrated XML schema set that is suited to interagency exchanges of navigation data messages. The current update applies general improvements and eliminates overlaps with other CCSDS navigation documents.</p>
    <p>This document issue was superseded by CCSDS 505.0-B-3, XML Specification for Navigation Data Messages (Blue Book, Issue 3), released May 2023.</p>
