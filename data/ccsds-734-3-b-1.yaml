abstract:
- language: en
  script: Latn
  content: "<p>This Recommended Standard specifies Schedule-Aware Bundle Routing (SABR)
    for the forwarding of Delay-Tolerant Networking (DTN) bundles in the space environment.
    \ SABR provides dynamic route computation in an environment of stable topology
    but time-varying connectivity when  instances of connectivity are scheduled rather
    than opportunistic.</p>\n"
