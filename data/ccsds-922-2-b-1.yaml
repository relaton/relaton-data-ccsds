abstract:
- language: en
  script: Latn
  content: |
    <p>This Recommended Standard defines the Tracking Data Cross Support Transfer Service (TD-CSTS), which allows a spaceflight mission to receive periodic measurements of certain tracking data as soon as they are generated by a Cross Support Complex or anytime thereafter.</p>
    <p>This document issue was superseded by CCSDS 922.2-B-2, Cross Support Transfer Service-Tracking Data Service (Blue Book, Issue 2), released February 2023.</p>
