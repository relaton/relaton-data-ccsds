abstract:
- language: en
  script: Latn
  content: "<p>This Recommended Standard defines a set of Service Management services
    by which space link service providers and space missions exchange information
    needed to arrange spacecraft contact periods and establish the operating parameters
    of the space link services and space link extension transfer services during those
    contact periods.</p>\n"
