abstract:
- language: en
  script: Latn
  content: "<p>The Mission Operations Message Abstraction Layer (MAL) Recommended
    Standard defines the MAL in conformance with the service framework specified in
    the Mission Operations Services Concept Green Book (CCSDS 520.0-G-3). The current
    update simplifies and clarifies text as part of an overall effort tonimprove MO
    framework specifications, corrects major deviations from CCSDS style guidelines,
    and attempts to better differentiate normative from informative text.</p>\n"
