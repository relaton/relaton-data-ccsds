abstract:
- language: en
  script: Latn
  content: "<p>The XML Telemetric and Command Exchange (XTCE) data specification provides
    an information model and data exchange format for telemetry and commanding in
    all phases of the a spacecraft, payload, and ground segment life cycle: system
    design, development, test, validation, and mission operations. The current CCSDS
    issue is version 1.2 of the specification as published by the Object Management
    Group (OMG) in January 2019.</p>\n"
