  content: |
    <p>This Recommendation establishes a common framework and provides a common basis for the formats of time code data.  The current issue defines a second P-Field octet for the CCSDS Unsegmented Time Code (CUC) and adds a Security Section. The CCSDS conducts periodic reconfirmation reviews of its publications to assure their continued relevance.</p>
    <p>This Recommended Standard has been reconfirmed through June 2022.</p>
