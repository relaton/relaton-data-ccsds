abstract:
- language: en
  script: Latn
  content: |
    <p>The Recommended Practice for Requirements for Bodies Providing Audit and Certification of Candidate Trustworthy Digital Repositories contains binding and verifiable specifications required to be fulfilled by organizations that perform ISO audits for assessing the trustworthiness of digital repositories using CCSDS 652.0-M-1, Audit and Certification of Trustworthy Digital Repositories, and provides the appropriate certification. The current issue has been updated to reflect input from ISO experts.</p>
    <p>This document issue was superseded by CCSDS 652.1-M-3, Requirements for Bodies Providing Audit and Certification of Candidate Trustworthy Digital Repositories (Magenta Book, Issue 3), released December 2024.</p>
