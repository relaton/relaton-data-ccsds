abstract:
- language: en
  script: Latn
  content: |
    <p>The Data Entity Dictionary Specification Language (DEDSL) standardizes of the expression of semantic concepts that are to be carried with data. The Recommended Standard for DEDSL--Abstract Syntax provides the abstract definition of the semantic information that is required to be conveyed and presents the specification in a layered manner (attributes, entities, dictionaries). As such the actual technique used to convey the information is independent of the information content; therefore the same abstract standard can be used within different formatting environments, and the semantic information may be translated to different representations as may be needed when data are transferred across different domains.  The CCSDS conducts periodic reconfirmation reviews of its publications to assure their continued relevance.</p>
    <p>This document has been reconfirmed by the CCSDS Management Council through June 2024.</p>
