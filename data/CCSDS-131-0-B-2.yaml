- language: en
  script: Latn
  content: "<p>The Recommended Standard for TM Synchronization and Channel Coding
    contains specifications to be used by space missions on synchronous communications
    links.  The current issue adds Low Density Parity Check (LDPC) codes, applies
    various editorial changes intended to improve the presentation and clarity of
    all the specifications, and adds new informative material for consistency with
    current CCSDS publications practices.</p>\n"
