abstract:
- language: en
  script: Latn
  content: "<p>This Informational Report describes an architecture in terms of CCSDS-recommended
    configurations for secure space communications cross support. This architecture
    is intended to be used as a common framework when CCSDS Agencies 1) provide and
    use space communications cross support services, and 2) develop systems that provide
    interoperable space communications cross support services.</p>\n"
