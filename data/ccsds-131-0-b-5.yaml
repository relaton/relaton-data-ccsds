abstract:
- language: en
  script: Latn
  content: |
    <p>The Recommended Standard for TM Synchronization and Channel Coding contains specifications to be used by space missions on synchronous communications links. The current update adds a new randomizer (based on a PN17 sequence) suitable for high-data-rate transmissions.</p>
    <p>This document issue was superseded by CCSDS 131.0-B65, TM Synchronization and Channel Coding (Blue Book, Issue 6), released April 2026.</p>
