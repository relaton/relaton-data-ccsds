  content: |
    <p>This Recommended Standard is an extension to CCSDS 122.0-B-2, Image Data Compression (Blue Book, Issue 2), defining a data compression algorithm that can be applied to digital three-dimensional image data from payload instruments, such as multispectral and hyperspectral imagers, and specifying the compressed data format.</p>
    <p>The CCSDS conducts periodic reconfirmation reviews of its publications to assure their continued relevance. This Recommended Standard has been reconfirmed through July 2028.</p>
