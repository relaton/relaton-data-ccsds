- language: en
  script: Latn
  content: "<p>This Recommended Standard defines the binding between the Mission Operations
    (MO) Message Abstraction Layer (MAL) and the ZeroMQ Message Transport Protocol
    (ZMTP). This binding allows MO Services to use ZMTP as messaging technology in
    all situations where this may be required.</p>\n"
