abstract:
- language: en
  script: Latn
  content: "<p>This Experimental Specification defines the Return CCSDS File Delivery
    Protocol (CFDP) Protocol Data Unit (PDU) Cross Support Transfer Service (RCFDP-CSTS).
    The RCFDP-CSTS is an experimental CSTS that allows the reception of CFDP PDUs,
    in either full or reduced mode, from an RCFDP-CSTS Provider.</p>\n"
