abstract:
- language: en
  script: Latn
  content: "<p>The Recommended Standard defines a CCSDS Asynchronous Message Service
    (AMS) for mission data system communications.  The service and its protocol implement
    an architectural concept under which the modules of mission systems may be designed
    as if they were to operate in isolation, each one producing and consuming mission
    information without explicit awareness of which other modules are currently operating.</p>\n"
