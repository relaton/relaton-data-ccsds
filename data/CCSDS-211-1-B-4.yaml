    <p>The CCSDS Recommended Standard for Proximity-1 Space Link Protocol—Physical Layer specifies the Physical Layer procedures used with the Proximity-1 Data Link Layer.  The current issue includes several improvements and clarifications, accomplishing better alignment and consistency with the other Proximity-1 Blue Books.</p>
