abstract:
- language: en
  script: Latn
  content: "<p>This CCSDS Recommended Standard specifies the Unified Space Data Link
    Protocol (USLP) for use by space missions over space-to-ground, ground-to-space,
    or space-to-space communications links. The current update adds VC Packet and
    VC Access services, changes the maximum number of frames per CLTU from one to
    greater than one to match the Telecommand specification, and adds to the security
    section a table, a diagram, and text concerning the order of COP to SDLS, similar
    to the Telecommand specification.</p>\n"
