  content: |
    <p>The Recommended Standards for Space Link Extension (SLE) services specify data services conformant to the transfer services specified in Cross Support Reference Model�Part 1: SLE Services (CCSDS 910.4-B-2).  The current drafts add clarifications and corrections, add or update production status annexes for consistency across all five SLE service specifications, and update specifications to accommodate recent additions to the CCSDS Recommended Standards for coding and synchronization.</p>
    <p>This document issue was superseded by CCSDS 911.2-B-4, Space Link Extension-Return Channel Frames Service Specification (Blue Book, Issue 4), released July 2023.</p>
