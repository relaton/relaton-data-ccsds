    <p>This Recommended Practice defines a C++ Application Program Interface (API) for CCSDS Space Link Extension (SLE) Transfer Services.  The API is intended for use by application programs implementing SLE services. The current issue updates text to be consistent with the current versions of the SLE service specifications.</p>
