abstract:
- language: en
  script: Latn
  content: "<p>This Recommended Practice defines the Spacecraft Onboard Interface
    Services (SOIS) File and Packet Store Services (FPSS).  The definition encompasses
    specification of the service interface exposed to onboard software (user applications
    and libraries) as well as the conceptual mapping of the FPSS primitives to the
    protocols implementing such services.</p>\n"
